<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Live weather for any country's capital, with an animated sky.">
<title>Live Weather</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#3a7bd5">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
/* Layout: full-bleed animated sky behind a single centred column of glass panels. */
:root {
  --ink: #fff;
  --muted: rgba(255,255,255,.72);
  --glass: rgba(255,255,255,.14);
  --glass-edge: rgba(255,255,255,.28);
  --ease-out: cubic-bezier(.2,.8,.2,1);
  --sky-a: #3a7bd5; --sky-b: #6fb1fc; --sky-c: #cfe8ff;
  --sun: 1; --moon: 0; --fog: 0; --cloud: rgba(255,255,255,.55); --cloud-opacity: .5;
  --font: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: dark;
}
body[data-sky="clear"][data-time="night"]  { --sky-a:#0b1026; --sky-b:#1a2550; --sky-c:#2d3a73; --sun:0; --moon:1; --cloud-opacity:.12; }
body[data-sky="cloudy"][data-time="day"]   { --sky-a:#5b7794; --sky-b:#8aa3bd; --sky-c:#c5d3e0; --cloud-opacity:.85; --sun:.25; --cloud:rgba(255,255,255,.7); }
body[data-sky="cloudy"][data-time="night"] { --sky-a:#10162a; --sky-b:#222b44; --sky-c:#3a4560; --sun:0; --moon:.35; --cloud-opacity:.5; --cloud:rgba(150,165,200,.4); }
body[data-sky="rain"][data-time="day"]     { --sky-a:#3b4a5e; --sky-b:#566a80; --sky-c:#8498ad; --sun:0; --cloud-opacity:.95; --cloud:rgba(120,135,155,.8); }
body[data-sky="rain"][data-time="night"]   { --sky-a:#0c111d; --sky-b:#1a2234; --sky-c:#2a344b; --sun:0; --moon:0; --cloud-opacity:.7; --cloud:rgba(80,95,120,.7); }
body[data-sky="thunder"][data-time="day"]  { --sky-a:#262f3d; --sky-b:#444a60; --sky-c:#646b82; --sun:0; --cloud-opacity:1; --cloud:rgba(70,78,98,.9); }
body[data-sky="thunder"][data-time="night"]{ --sky-a:#0a0c14; --sky-b:#1a1d30; --sky-c:#2c3048; --sun:0; --cloud-opacity:.85; --cloud:rgba(60,66,90,.8); }
body[data-sky="snow"][data-time="day"]     { --sky-a:#6f88a8; --sky-b:#a5b9cf; --sky-c:#dbe5ef; --sun:.15; --cloud-opacity:.8; }
body[data-sky="snow"][data-time="night"]   { --sky-a:#1e2a42; --sky-b:#3d5078; --sky-c:#6a82a8; --sun:0; --moon:.3; --cloud-opacity:.5; }
body[data-sky="fog"][data-time="day"]      { --sky-a:#8a959f; --sky-b:#b5bec6; --sky-c:#d9dde2; --sun:.2; --fog:.8; --cloud-opacity:.3; }
body[data-sky="fog"][data-time="night"]    { --sky-a:#1d242c; --sky-b:#384350; --sky-c:#55616e; --sun:0; --moon:.15; --fog:.55; --cloud-opacity:.2; }

* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  font-family: var(--font); color: var(--ink); background: var(--sky-a);
  padding-block: 28px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  line-height: 1.4; -webkit-font-smoothing: antialiased;
}
.sky { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none;
  background: linear-gradient(180deg, var(--sky-a) 0%, var(--sky-b) 55%, var(--sky-c) 100%);
  transition: background 1.2s; }
.sky-sun, .sky-moon, .sky-fog { position: absolute; transition: opacity 1.2s, top 1.2s; }
.sky-sun { top: 6%; right: 8%; width: 200px; height: 200px; border-radius: 50%; opacity: var(--sun);
  background: radial-gradient(circle, #fffbe6 0 22%, rgba(255,230,150,.65) 38%, rgba(255,214,120,0) 70%); }
.sky-moon { top: 9%; right: 14%; width: 84px; height: 84px; border-radius: 50%; opacity: var(--moon);
  background: radial-gradient(circle at 35% 35%, #fff, #dfe6ff 60%, #b8c3ee); box-shadow: 0 0 60px 18px rgba(190,205,255,.28); }
.sky-fog { inset: 0; opacity: var(--fog); filter: blur(30px); animation: fog-sway 28s ease-in-out infinite alternate;
  background: radial-gradient(120% 40% at 30% 62%, rgba(255,255,255,.55), transparent 70%), radial-gradient(120% 40% at 70% 40%, rgba(255,255,255,.45), transparent 70%); }
.cloud { position: absolute; left: -40vw; border-radius: 999px; background: var(--cloud); filter: blur(24px);
  opacity: var(--cloud-opacity); transition: opacity 1.2s; animation: drift var(--duration) linear infinite; animation-delay: var(--delay); }
.cloud--1 { top: 6%;  width: 62vw; height: 90px;  --duration: 120s; --delay: -30s; }
.cloud--2 { top: 20%; width: 80vw; height: 110px; --duration: 150s; --delay: -90s; }
.cloud--3 { top: 36%; width: 55vw; height: 80px;  --duration: 100s; --delay: -10s; }
.cloud--4 { top: 54%; width: 90vw; height: 120px; --duration: 170s; --delay: -120s; }
.cloud--5 { top: 72%; width: 70vw; height: 100px; --duration: 130s; --delay: -60s; }
@keyframes drift { to { transform: translateX(200vw); } }
@keyframes fog-sway { from { transform: translateX(-6%); } to { transform: translateX(6%); } }
/* Dawn and dusk: warm horizon glow. */
.sky::after { content: ""; position: absolute; inset: 0; opacity: 0; transition: opacity 1.2s;
  background: radial-gradient(130% 55% at 50% 108%, rgba(255,140,60,.8), rgba(255,90,100,.35) 42%, transparent 75%); }
body[data-phase="dawn"] .sky::after, body[data-phase="dusk"] .sky::after { opacity: 1; }
#fx { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; }
#flash { position: fixed; inset: 0; z-index: 2; background: #fff; opacity: 0; pointer-events: none; }

.wrap { position: relative; z-index: 3; max-width: 880px; margin: 0 auto; display: grid; grid-template-columns: minmax(0,1fr); gap: 16px; }
#report { display: grid; gap: 16px; min-width: 0; }
.panel { min-width: 0; }
.top { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
.brand { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.search { display: flex; flex: 1 1 320px; max-width: 520px; min-width: 0; border-radius: 999px; background: var(--glass);
  border: 1px solid var(--glass-edge); -webkit-backdrop-filter: blur(18px) saturate(1.2); backdrop-filter: blur(18px) saturate(1.2);
  transition: border-color .2s; position: relative; }
.search:focus-within { border-color: rgba(255,255,255,.6); }
.search input { flex: 1; width: 0; min-width: 0; padding: 12px 18px; border: 0; outline: none; background: transparent; color: var(--ink); font: inherit; font-size: 15px; }
.search input::placeholder { color: var(--muted); }
.search button { padding: 10px 20px; border: 0; background: rgba(255,255,255,.2); color: var(--ink); font: inherit; font-weight: 600; cursor: pointer; border-radius: 0 999px 999px 0; }
.search button:hover { background: rgba(255,255,255,.32); }
.search button:focus-visible, .chip:focus-visible, .unit:focus-visible, .sug button:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
.search[aria-busy="true"] button { opacity: .6; cursor: progress; }
.sug { position: absolute; left: 0; right: 0; top: calc(100% + 6px); z-index: 5; margin: 0; padding: 6px; list-style: none;
  border-radius: 18px; background: rgba(20,28,46,.88); -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px); border: 1px solid var(--glass-edge); }
.sug button { width: 100%; text-align: left; background: transparent; border: 0; color: var(--ink); font: inherit; padding: 8px 12px; border-radius: 12px; cursor: pointer; display: flex; gap: 10px; align-items: center; }
.sug button:hover, .sug button[aria-selected="true"] { background: rgba(255,255,255,.14); }
.unit { padding: 9px 14px; border-radius: 999px; border: 1px solid var(--glass-edge); background: var(--glass); color: var(--ink); font: inherit; font-weight: 600; cursor: pointer; }
.status { min-height: 20px; margin: -6px 4px 0; font-size: 13px; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { padding: 6px 12px; border-radius: 999px; border: 1px solid var(--glass-edge); background: var(--glass); color: var(--ink); font: inherit; font-size: 13px; cursor: pointer; }
.chip:hover { background: rgba(255,255,255,.26); }
.chip strong { font-weight: 700; }

.panel { padding: 22px; border-radius: 24px; background: var(--glass); border: 1px solid var(--glass-edge);
  -webkit-backdrop-filter: blur(18px) saturate(1.2); backdrop-filter: blur(18px) saturate(1.2);
  box-shadow: 0 10px 40px rgba(0,0,0,.14); animation: rise .7s var(--ease-out) both; animation-delay: calc(var(--i, 0) * 90ms); }
@keyframes rise { from { opacity: 0; transform: translateY(18px); } }
.panel-title { margin: 0 0 14px; color: var(--muted); font-size: 12px; font-weight: 500; letter-spacing: .12em; text-transform: uppercase; }
.place { display: flex; align-items: center; gap: 12px; }
.flag { font-size: 36px; line-height: 1; }
.place-name { margin: 0; font-size: 24px; font-weight: 500; line-height: 1.1; }
.place-sub { margin: 2px 0 0; color: var(--muted); font-size: 14px; }
.now-main { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 8px 0 4px; flex-wrap: wrap; }
.temp { margin: 0; text-shadow: 0 4px 30px rgba(0,0,0,.25); font-size: clamp(88px, 28vw, 124px); font-weight: 200; line-height: 1; letter-spacing: -.04em; font-variant-numeric: tabular-nums; }
.now-side { display: grid; justify-items: center; gap: 4px; text-align: center; }
.condition { margin: 0; font-size: 18px; font-weight: 400; }
.summary { margin: 4px 0 0; color: var(--muted); font-size: 15px; line-height: 1.4; }
.pills { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0 0; padding: 0; list-style: none; }
.pill { display: inline-flex; align-items: baseline; gap: 8px; padding: 7px 13px; border-radius: 999px; background: rgba(255,255,255,.14); font-variant-numeric: tabular-nums; }
.pill span { color: var(--muted); font-size: 13px; font-weight: 400; }
.wx-icon { display: inline-grid; place-items: center; width: 28px; height: 28px; }
.wx-icon svg { width: 100%; height: 100%; overflow: visible; }
.wx-icon--xl { width: 84px; height: 84px; }

.hours { display: flex; gap: 6px; margin: 0; padding: 0 0 6px; list-style: none; overflow-x: auto; scrollbar-width: thin; }
.hour { flex: 0 0 auto; width: 62px; display: grid; justify-items: center; gap: 8px; padding: 10px 0; border-radius: 16px; font-variant-numeric: tabular-nums; }
.hour:first-child { background: rgba(255,255,255,.16); }
.hour-time { font-size: 13px; color: var(--muted); }
.days { margin: 0; padding: 0; list-style: none; display: grid; }
.day { display: grid; grid-template-columns: 64px 34px 44px 44px 1fr 44px; align-items: center; gap: 8px; padding: 10px 0; border-top: 1px solid rgba(255,255,255,.14); font-variant-numeric: tabular-nums; }
.day:first-child { border-top: 0; }
.day-rain { color: #bfe0ff; font-size: 12px; }
.day-low { color: var(--muted); text-align: right; }
.day-high { text-align: right; }
.day-bar { position: relative; height: 5px; border-radius: 3px; background: rgba(255,255,255,.18); min-width: 40px; }
.day-fill { position: absolute; top: 0; bottom: 0; border-radius: 3px; background: linear-gradient(90deg, #7fd3ff, #ffd36e); }
@media (max-width: 460px) { .day { grid-template-columns: 52px 30px 34px 36px 1fr 36px; gap: 6px; } .panel { padding: 18px; } }

.intro { padding: 36px 8px; text-align: center; }
.intro h1 { margin: 0 0 8px; font-size: clamp(28px, 6vw, 44px); font-weight: 300; letter-spacing: -.02em; text-wrap: balance; }
.intro p { margin: 0; color: var(--muted); }
.skel { border-radius: 12px; background: linear-gradient(90deg, rgba(255,255,255,.1), rgba(255,255,255,.26), rgba(255,255,255,.1)); background-size: 200% 100%; animation: shimmer 1.3s linear infinite; }
@keyframes shimmer { to { background-position: -200% 0; } }
.note { font-size: 12px; color: var(--muted); text-align: center; }
.cities { display: grid; gap: 12px; position: relative; z-index: 4; }
.cities .panel-title { margin: 0; }
.city-search { max-width: none; }
.chip[aria-pressed="true"] { background: rgba(255,255,255,.88); color: #14213a; border-color: transparent; }
.chip small { opacity: .7; margin-left: 4px; }
/* Splash: shown on launch, fades out after the first paint. */
#splash { position: fixed; inset: 0; z-index: 100; display: grid; place-content: center; justify-items: center; gap: 18px;
  background: linear-gradient(180deg, #3a7bd5 0%, #6fb1fc 55%, #cfe8ff 100%); color: #fff; transition: opacity .6s ease, visibility .6s; }
#splash.hide { opacity: 0; visibility: hidden; }
#splash svg { width: 132px; height: 132px; animation: splash-pop .9s var(--ease-out) both; }
#splash .sun { transform-origin: 50% 50%; animation: splash-spin 12s linear infinite; }
#splash p { margin: 0; font-size: 26px; font-weight: 600; letter-spacing: .01em; animation: rise .8s var(--ease-out) .25s both; }
@keyframes splash-pop { from { opacity: 0; transform: scale(.7); } }
@keyframes splash-spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body data-sky="clear" data-time="day" data-phase="day">
<div id="splash" role="img" aria-label="Live Weather">
  <svg viewBox="0 0 32 32" aria-hidden="true">
    <g class="sun"><circle cx="12" cy="11" r="5" fill="#ffd54a"/><g stroke="#ffd54a" stroke-width="1.6" stroke-linecap="round"><path d="M12 1.5v2.5M12 18v2.5M2.5 11H5M19 11h2.5M5.3 4.3l1.8 1.8M16.9 15.9l1.8 1.8M18.7 4.3l-1.8 1.8M7.1 15.9l-1.8 1.8"/></g></g>
    <path d="M10 28a5.4 5.4 0 0 1-.7-10.75A7.5 7.5 0 0 1 24 15 6 6 0 0 1 25 28z" fill="#f5f9ff"/>
  </svg>
  <p>Live Weather</p>
</div>
<div class="sky" aria-hidden="true">
  <div class="sky-sun"></div><div class="sky-moon"></div><div class="sky-fog"></div>
  <div class="cloud cloud--1"></div><div class="cloud cloud--2"></div><div class="cloud cloud--3"></div><div class="cloud cloud--4"></div><div class="cloud cloud--5"></div>
</div>
<canvas id="fx" aria-hidden="true"></canvas>
<div id="flash" aria-hidden="true"></div>

<main class="wrap">
  <div class="top">
    <span class="brand">Live Weather</span>
    <button class="unit" id="unit" type="button" aria-label="Switch units">°C</button>
  </div>
  <form class="search" id="form" role="search" autocomplete="off">
    <input id="q" type="text" placeholder="Search a country, e.g. Japan" aria-label="Country" spellcheck="false" autocomplete="off">
    <button type="submit">Search</button>
    <ul class="sug" id="sug" role="listbox" hidden></ul>
  </form>
  <div class="status" id="status" role="status" aria-live="polite"></div>
  <div class="chips" id="chips"></div>
  <section class="panel cities" id="cities" hidden>
    <h2 class="panel-title" id="cities-title">Cities</h2>
    <div class="chips" id="city-chips"></div>
    <form class="search city-search" id="city-form" autocomplete="off">
      <input id="city-q" type="text" placeholder="Search any city" aria-label="City" spellcheck="false" autocomplete="off">
      <button type="submit">Go</button>
      <ul class="sug" id="city-sug" role="listbox" hidden></ul>
    </form>
  </section>
  <div id="report"></div>
  <p class="note" id="note"></p>
</main>

<script>
(function App() {
  "use strict";

  /* WMO weather code -> [label, sky class, intensity 0..2] */
  const TABLE = {
    0: ["Clear sky", "clear", 1], 1: ["Mainly clear", "clear", 1], 2: ["Partly cloudy", "cloudy", 1], 3: ["Overcast", "cloudy", 1],
    45: ["Fog", "fog", 1], 48: ["Freezing fog", "fog", 1],
    51: ["Light drizzle", "rain", .5], 53: ["Drizzle", "rain", .8], 55: ["Heavy drizzle", "rain", 1.2],
    56: ["Freezing drizzle", "rain", .6], 57: ["Freezing drizzle", "rain", 1],
    61: ["Light rain", "rain", .6], 63: ["Rain", "rain", 1], 65: ["Heavy rain", "rain", 1.6],
    66: ["Freezing rain", "rain", .8], 67: ["Freezing rain", "rain", 1.4],
    71: ["Light snow", "snow", .6], 73: ["Snow", "snow", 1], 75: ["Heavy snow", "snow", 1.6], 77: ["Snow grains", "snow", .8],
    80: ["Light showers", "rain", .7], 81: ["Showers", "rain", 1.1], 82: ["Violent showers", "rain", 1.8],
    85: ["Snow showers", "snow", .9], 86: ["Heavy snow showers", "snow", 1.6],
    95: ["Thunderstorm", "thunder", 1.4], 96: ["Thunderstorm, hail", "thunder", 1.6], 99: ["Severe thunderstorm", "thunder", 2]
  };
  const conditions = {
    describe(code, isDay) {
      const [label, sky, intensity] = TABLE[code] || ["Unknown", "cloudy", 1];
      let icon = sky;
      if (sky === "clear") icon = isDay ? "sun" : "moon";
      if (code === 2) icon = isDay ? "partly" : "partly-night";
      return { label, sky, intensity, icon };
    }
  };

      return this.shape({
        sample: true,
        current: { time: iso(day, h), temperature_2m: temp[h], apparent_temperature: temp[h] + 1, relative_humidity_2m: 64, surface_pressure: 1012, wind_speed_10m: 14, wind_direction_10m: 230, weather_code: code[h], is_day: isDay[h] },
        hourly: { time: times, temperature_2m: temp, weather_code: code, is_day: isDay },
        daily: { time: days.map(d => iso(d).slice(0, 10)), weather_code: [2, 61, 3, 2, 0, 1, 63], temperature_2m_max: [24, 22, 21, 25, 27, 26, 23], temperature_2m_min: [15, 14, 14, 16, 17, 16, 15], precipitation_probability_max: [10, 70, 30, 10, 0, 5, 80], sunrise: days.map(d => iso(d, 6)), sunset: days.map(d => iso(d, 18)) }
      });
    }
  };

  /* Sky and particles */
  const sky = {
    apply(code, isDay, phase) {
      const { sky: s } = conditions.describe(code, isDay);
      document.body.dataset.sky = s; document.body.dataset.time = isDay ? "day" : "night"; document.body.dataset.phase = phase;
    },
    phase(now, day, isDay) {
      const t = new Date(now).getTime(), rise = new Date(day.sunrise).getTime(), set = new Date(day.sunset).getTime(), w = 45 * 60e3;
      if (Math.abs(t - rise) < w) return "dawn"; if (Math.abs(t - set) < w) return "dusk"; return isDay ? "day" : "night";
    }
  };

  class Particles {
    #canvas = document.getElementById("fx"); #ctx = this.#canvas.getContext("2d"); #flash = document.getElementById("flash");
    #particles = []; #kind = "none"; #intensity = 1; #last = 0; #frame = 0; #size = { width: 0, height: 0, ratio: 1 }; #nextBolt = 0;
    constructor() { this.resize(); addEventListener("resize", () => this.resize()); }
    resize() {
      const ratio = Math.min(devicePixelRatio || 1, 2), width = innerWidth, height = innerHeight;
      this.#canvas.width = width * ratio; this.#canvas.height = height * ratio; this.#size = { width, height, ratio };
    }
    set(kind, intensity) {
      this.#kind = kind; this.#intensity = intensity;
      cancelAnimationFrame(this.#frame);
      const on = ["rain", "snow", "thunder"].includes(kind) && !matchMedia("(prefers-reduced-motion: reduce)").matches;
      if (on) {
        const n = Math.round((kind === "snow" ? 110 : 160) * intensity);
        this.#particles = Array.from({ length: n }, () => this.#spawn(true));
        this.#last = performance.now(); this.#frame = requestAnimationFrame(this.#tick);
      } else { this.#particles = []; this.#ctx.clearRect(0, 0, this.#canvas.width, this.#canvas.height); }
    }
    #spawn(anywhere) {
      const { width, height } = this.#size, snow = this.#kind === "snow";
      return { x: Math.random() * width, y: anywhere ? Math.random() * height : -20, z: .5 + Math.random(),
        len: snow ? 0 : 10 + Math.random() * 14, v: snow ? 40 + Math.random() * 50 : 600 + Math.random() * 500, drift: snow ? (Math.random() - .5) * 40 : -90, r: .8 + Math.random() * 2.2 };
    }
    #tick = now => {
      const dt = Math.min((now - this.#last) / 1000, .05); this.#last = now;
      this.#draw(now, dt); this.#frame = requestAnimationFrame(this.#tick);
    };
    #draw(now, dt) {
      const ctx = this.#ctx, { width, height, ratio } = this.#size, snow = this.#kind === "snow";
      ctx.setTransform(ratio, 0, 0, ratio, 0, 0); ctx.clearRect(0, 0, width, height);
      ctx.strokeStyle = "rgba(190,220,255,.55)"; ctx.fillStyle = "rgba(255,255,255,.85)"; ctx.lineWidth = 1.1;
      for (const p of this.#particles) {
        p.y += p.v * p.z * dt; p.x += p.drift * dt * (snow ? Math.sin(now / 900 + p.r) : 1);
        if (p.y > height + 20 || p.x < -20 || p.x > width + 20) Object.assign(p, this.#spawn(false));
        if (snow) { ctx.beginPath(); ctx.arc(p.x, p.y, p.r * p.z, 0, 6.283); ctx.fill(); }
        else { ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x + p.drift * .02 * p.len, p.y - p.len * p.z); ctx.stroke(); }
      }
      if (this.#kind === "thunder" && now > this.#nextBolt) {
        this.#nextBolt = now + 3500 + Math.random() * 7000;
        this.#flash.animate([{ opacity: 0 }, { opacity: .55 }, { opacity: .1 }, { opacity: .4 }, { opacity: 0 }], { duration: 650 });
      }
    }
  }
  const particles = new Particles();

  /* Views */
  const report = {
    root: document.getElementById("report"),
    renderSkeleton() {
      const block = n => el("div", { class: "skel", style: `height:${n}px` });
      this.root.replaceChildren(el("section", { class: "panel", style: "--i:0;display:grid;gap:14px" }, block(34), block(110), block(24)), el("section", { class: "panel", style: "--i:1" }, block(80)));
    },
    renderIntro() {
      this.root.replaceChildren(el("section", { class: "intro" }, el("h1", {}, "Weather for any country"), el("p", {}, "Search a country to see the live conditions in its capital.")));
    },
    show(place, data) {
      const { current, days, hours } = data, now = conditions.describe(current.code, current.isDay), today = days[0];
      const rain = today.rain;
      const outlook = rain == null ? "" : rain >= 60 ? `Rain is likely today (${rain}%). ` : rain >= 30 ? `A chance of rain today (${rain}%). ` : "";
      const summary = `${outlook}Wind ${units.speed(current.windSpeed)} ${format.compass(current.windDirection)}.`;
      const pill = (label, value) => el("li", { class: "pill" }, el("span", {}, label), value);
      const span = Math.max(...days.map(d => d.max)) - Math.min(...days.map(d => d.min)) || 1, floor = Math.min(...days.map(d => d.min));
      const rows = days.map((day, i) => {
        const left = (day.min - floor) / span * 100, width = Math.max((day.max - day.min) / span * 100, 6);
        return el("li", { class: "day" },
          el("span", { class: "day-name" }, i === 0 ? "Today" : format.weekday(day.date)), icon(conditions.describe(day.code, true).icon),
          el("span", { class: "day-rain" }, day.rain == null || day.rain < 10 ? "" : `${day.rain}%`),
          el("span", { class: "day-low" }, units.temperature(day.min)),
          el("span", { class: "day-bar" }, el("span", { class: "day-fill", style: `left:${left}%;width:${width}%` })),
          el("span", { class: "day-high" }, units.temperature(day.max)));
      });
      this.root.replaceChildren(
        el("section", { class: "panel now", style: "--i:0" },
          el("header", { class: "place" }, el("span", { class: "flag", "aria-hidden": "true" }, place.flag),
            el("div", {}, el("h1", { class: "place-name" }, place.name), el("p", { class: "place-sub" }, `${place.city} · ${format.clock(current.time)} local`))),
          el("div", { class: "now-main" }, el("p", { class: "temp" }, units.temperature(current.temperature)),
            el("div", { class: "now-side" }, icon(now.icon, "wx-icon wx-icon--xl"), el("p", { class: "condition" }, now.label))),
          el("p", { class: "summary" }, summary),
          el("ul", { class: "pills" },
            pill("Feels like", units.temperature(current.feelsLike)), pill("Humidity", `${Math.round(current.humidity)}%`),
            pill("Pressure", units.pressure(current.pressure)), pill("Sunrise", format.clock(today.sunrise)), pill("Sunset", format.clock(today.sunset)))),
        el("section", { class: "panel", style: "--i:1" }, el("h2", { class: "panel-title" }, "Next 24 hours"),
          el("ul", { class: "hours" }, hours.map((h, i) => el("li", { class: "hour" }, el("span", { class: "hour-time" }, i === 0 ? "Now" : format.hour(h.time)), icon(conditions.describe(h.code, h.isDay).icon), el("span", {}, units.temperature(h.temperature)))))),
        el("section", { class: "panel", style: "--i:2" }, el("h2", { class: "panel-title" }, `${days.length}-day forecast`), el("ul", { class: "days" }, rows)));
      const phase = sky.phase(current.time, today, current.isDay);
      sky.apply(current.code, current.isDay, phase);
      particles.set(now.sky, now.intensity);
    }
  };

  /* Search */
  const form = document.getElementById("form"), input = document.getElementById("q"), sug = document.getElementById("sug");
  const statusEl = document.getElementById("status"), noteEl = document.getElementById("note"), chipsEl = document.getElementById("chips"), unitBtn = document.getElementById("unit");
  let state = null, latest = 0, activeSug = -1;
  const setStatus = t => { statusEl.textContent = t; };

  async function submit(query, cityPick) {
    const request = ++latest, isCurrent = () => request === latest;
    hideSug(); hideCitySug(); setStatus(""); noteEl.textContent = "";
    const country = countries.find(query);
    if (!country) { const s = countries.suggest(query)[0]; return setStatus(s ? `No exact match for "${query}". Did you mean ${s.name}?` : `We couldn't find "${query}". Try the full country name.`); }
    const city = cityPick || { name: country.city, lat: country.lat, lon: country.lon, capital: true };
    const place = { ...country, city: city.name, lat: city.lat, lon: city.lon };
    form.setAttribute("aria-busy", "true"); if (!state) report.renderSkeleton();
    renderCities(country, city);
    try {
      let data;
      try { data = await forecast.fetch(place); }
      catch { data = forecast.sample(); }
      if (!isCurrent()) return;
      state = { place, forecast: data }; input.value = country.name; store.set("last", country.name); store.set("city:" + country.cc, JSON.stringify(city));
      report.show(place, data);
      noteEl.textContent = data.sample ? "Showing sample data because the live forecast couldn't be reached. Open this file from your own computer for live weather." : "";
      try { history.replaceState(null, "", "#" + encodeURIComponent(country.name)); } catch {}
    } finally { if (isCurrent()) form.removeAttribute("aria-busy"); }
  }

  /* City picker */
  const citiesEl = document.getElementById("cities"), cityChips = document.getElementById("city-chips"), cityForm = document.getElementById("city-form");
  const cityInput = document.getElementById("city-q"), citySug = document.getElementById("city-sug");
  let cityCountry = null, cityTimer = 0, cityReq = 0;
  function hideCitySug() { citySug.hidden = true; }
  function renderCities(country, active) {
    cityCountry = country; citiesEl.hidden = false; cityInput.value = "";
    document.getElementById("cities-title").textContent = `Choose a city in ${country.name}`;
    cityInput.placeholder = `Search any city in ${country.name}`;
    const list = cityList(country);
    if (active && !list.some(c => norm(c.name) === norm(active.name))) list.push(active);
    cityChips.replaceChildren(...list.map(c => el("button", { type: "button", class: "chip", "aria-pressed": String(norm(c.name) === norm(active?.name || "")), onclick: () => submit(country.name, c) },
      c.name, c.capital ? el("small", {}, "capital") : null)));
  }
  cityInput.addEventListener("input", () => {
    clearTimeout(cityTimer); const q = cityInput.value.trim();
    if (q.length < 2 || !cityCountry) return hideCitySug();
    const req = ++cityReq;
    cityTimer = setTimeout(async () => {
      let found = [];
      try { found = await findCities(q, cityCountry.cc); } catch { found = []; }
      if (req !== cityReq) return;
      if (!found.length) { citySug.replaceChildren(el("li", {}, el("button", { type: "button", disabled: true }, "No matching city (needs internet)"))); citySug.hidden = false; return; }
      citySug.replaceChildren(...found.map(c => el("li", { role: "option" }, el("button", { type: "button", onmousedown: e => { e.preventDefault(); submit(cityCountry.name, c); } },
        el("span", {}, c.name), el("span", { style: "margin-left:auto;color:var(--muted);font-size:13px" }, c.region)))));
      citySug.hidden = false;
    }, 280);
  });
  cityInput.addEventListener("blur", () => setTimeout(hideCitySug, 120));
  cityForm.addEventListener("submit", async e => {
    e.preventDefault(); const q = cityInput.value.trim(); if (!q || !cityCountry) return;
    try { const [c] = await findCities(q, cityCountry.cc); if (c) return submit(cityCountry.name, c); } catch {}
    setStatus(`We couldn't find "${q}" in ${cityCountry.name}. Check the spelling or your internet connection.`);
  });

  function showSug() {
    const list = countries.suggest(input.value); activeSug = -1;
    if (!list.length || document.activeElement !== input) return hideSug();
    sug.replaceChildren(...list.map(c => el("li", { role: "option" }, el("button", { type: "button", onmousedown: e => { e.preventDefault(); pick(c.name); } }, el("span", {}, c.flag), el("span", {}, c.name), el("span", { style: "margin-left:auto;color:var(--muted);font-size:13px" }, c.city)))));
    sug.hidden = false;
  }
  function hideSug() { sug.hidden = true; activeSug = -1; }
  function pick(name) { input.value = name; hideSug(); renderChips(); submit(name); }
  function renderChips() {
    const names = ["Japan", "Brazil", "Iceland", "Egypt", "Canada", "India", "Australia", "Norway"];
    chipsEl.replaceChildren(...names.map(n => el("button", { type: "button", class: "chip", onclick: () => pick(n) }, el("strong", {}, n))));
  }

  input.addEventListener("input", showSug);
  input.addEventListener("focus", showSug);
  input.addEventListener("blur", () => setTimeout(hideSug, 100));
  input.addEventListener("keydown", e => {
    const items = [...sug.querySelectorAll("button")];
    if (sug.hidden || !items.length) return;
    if (e.key === "ArrowDown" || e.key === "ArrowUp") {
      e.preventDefault(); activeSug = (activeSug + (e.key === "ArrowDown" ? 1 : -1) + items.length) % items.length;
      items.forEach((b, i) => b.setAttribute("aria-selected", String(i === activeSug)));
    } else if (e.key === "Enter" && activeSug >= 0) { e.preventDefault(); items[activeSug].dispatchEvent(new MouseEvent("mousedown")); }
    else if (e.key === "Escape") hideSug();
  });
  form.addEventListener("submit", e => { e.preventDefault(); submit(input.value); });
  unitBtn.addEventListener("click", () => {
    units.metric = !units.metric; store.set("units", units.metric ? "metric" : "imperial"); unitBtn.textContent = units.label();
    if (state) report.show(state.place, state.forecast);
  });


  /* Hide the splash after 1.6 s */
  setTimeout(() => document.getElementById("splash")?.classList.add("hide"), 1600);
  if ("serviceWorker" in navigator && location.protocol.startsWith("http")) navigator.serviceWorker.register("sw.js").catch(() => {});
  unitBtn.textContent = units.label();
  renderChips(); report.renderIntro();
  let start = ""; try { start = decodeURIComponent(location.hash.slice(1)); } catch {}
  start = start || store.get("last", "") || "Japan";
  const startCountry = countries.find(start);
  if (startCountry) { let saved = null; try { saved = JSON.parse(store.get("city:" + startCountry.cc, "null")); } catch {} submit(startCountry.name, saved && saved.lat != null ? saved : undefined); }
})();
</script>
